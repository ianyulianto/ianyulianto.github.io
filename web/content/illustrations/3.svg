<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t3">
  <title id="t3">Kertas gambar rumah, krayon, dan lampu merah</title>
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe5"/>
      <stop offset="100%" stop-color="#e4dccb"/>
    </linearGradient>
    <radialGradient id="warm3" cx="40%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#e8c56d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8c56d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="320" fill="url(#sky3)"/>
  <ellipse cx="188" cy="150" rx="152" ry="122" fill="url(#warm3)"/>
  <!-- child's drawing on paper, slightly tilted -->
  <g transform="rotate(-5 180 148)">
    <rect x="86" y="70" width="188" height="150" rx="4" fill="#f8f3e8" stroke="#1c1a17" stroke-width="2"/>
    <!-- crayon sun -->
    <circle cx="128" cy="106" r="15" fill="none" stroke="#e8c56d" stroke-width="3"/>
    <g stroke="#e8c56d" stroke-width="2.4" stroke-linecap="round">
      <path d="M128 84 v-8 M128 136 v8 M106 106 h-8 M150 106 h8 M112 90 l-6 -6 M144 90 l6 -6 M112 122 l-6 6 M144 122 l6 6"/>
    </g>
    <!-- naive house -->
    <path d="M150 198 v-40 l34 -26 l34 26 v40 Z" fill="#f3efe6" stroke="#c97878" stroke-width="2.6" stroke-linejoin="round"/>
    <rect x="172" y="170" width="22" height="28" fill="none" stroke="#2f5d56" stroke-width="2.2"/>
    <path d="M140 132 l44 -34 l44 34" fill="none" stroke="#7a9e98" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- scattered crayons -->
  <g stroke="#1c1a17" stroke-width="1.4" stroke-linejoin="round">
    <g transform="rotate(18 120 262)">
      <rect x="92" y="256" width="68" height="12" rx="3" fill="#c97878"/>
      <path d="M160 256 l10 6 l-10 6 z" fill="#c97878"/>
    </g>
    <g transform="rotate(6 150 281)">
      <rect x="120" y="276" width="72" height="12" rx="3" fill="#2f5d56"/>
      <path d="M192 276 l10 6 l-10 6 z" fill="#2f5d56"/>
    </g>
    <g transform="rotate(-10 150 301)">
      <rect x="118" y="296" width="64" height="12" rx="3" fill="#e8c56d"/>
      <path d="M182 296 l10 6 l-10 6 z" fill="#e8c56d"/>
    </g>
  </g>
  <!-- traffic light, stuck on red -->
  <g transform="translate(374 92)">
    <rect x="0" y="0" width="46" height="112" rx="12" fill="#ebe4d6" stroke="#1c1a17" stroke-width="2"/>
    <line x1="23" y1="112" x2="23" y2="152" stroke="#1c1a17" stroke-width="3" stroke-linecap="round"/>
    <circle cx="23" cy="26" r="13" fill="#c97878" stroke="#1c1a17" stroke-width="1.6"/>
    <circle cx="23" cy="56" r="13" fill="#ece5d7" stroke="#7a7366" stroke-width="1.6"/>
    <circle cx="23" cy="86" r="13" fill="#ece5d7" stroke="#7a7366" stroke-width="1.6"/>
  </g>
</svg>
