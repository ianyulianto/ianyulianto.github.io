<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t5">
  <title id="t5">Jalan pulang menuju cahaya pintu dan kunciran stroberi</title>
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe8da"/>
      <stop offset="100%" stop-color="#ddd3bf"/>
    </linearGradient>
    <radialGradient id="doorlight" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff6df" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#e8c56d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8c56d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="320" fill="url(#sky5)"/>
  <!-- path home -->
  <path d="M196 320 C210 250 190 190 224 140 C246 108 266 96 280 88" fill="none" stroke="#b9a483" stroke-width="40" stroke-linecap="round"/>
  <path d="M196 320 C210 250 190 190 224 140 C246 108 266 96 280 88" fill="none" stroke="#cbb99a" stroke-width="24" stroke-linecap="round"/>
  <!-- doorway of light -->
  <rect x="248" y="48" width="72" height="110" rx="36 36 4 4" fill="#ebe4d6" stroke="#1c1a17" stroke-width="2"/>
  <ellipse cx="284" cy="98" rx="40" ry="48" fill="url(#doorlight)"/>
  <rect x="262" y="68" width="44" height="90" rx="22 22 2 2" fill="#f7f1e4" opacity="0.85"/>
  <!-- distant small figure -->
  <g opacity="0.4" stroke="#1c1a17" stroke-width="1.5" fill="none" stroke-linecap="round">
    <circle cx="284" cy="206" r="6"/>
    <path d="M284 212 v20 M275 222 l9 -5 9 5 M284 232 l-6 15 M284 232 l6 15"/>
  </g>
  <!-- strawberry hair tie left on the path -->
  <g transform="translate(150 252)">
    <ellipse cx="0" cy="0" rx="26" ry="13" fill="none" stroke="#c97878" stroke-width="3"/>
    <circle cx="-26" cy="0" r="7" fill="#c97878" stroke="#1c1a17" stroke-width="1.4"/>
    <circle cx="26" cy="0" r="7" fill="#c97878" stroke="#1c1a17" stroke-width="1.4"/>
    <g transform="translate(0 -1)">
      <path d="M0 -6 C10 -6 12 4 0 16 C-12 4 -10 -6 0 -6 Z" fill="#c97878" stroke="#1c1a17" stroke-width="1.4"/>
      <path d="M-7 -6 L0 -12 L7 -6" fill="#2f5d56" stroke="#2f5d56" stroke-width="1.2" stroke-linejoin="round"/>
      <g fill="#f8f3e8"><circle cx="-3" cy="3" r="1"/><circle cx="3" cy="3" r="1"/><circle cx="0" cy="8" r="1"/></g>
    </g>
  </g>
</svg>
