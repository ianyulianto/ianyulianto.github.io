<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t4">
  <title id="t4">Cermin dan terusan polkadot merah</title>
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3eee4"/>
      <stop offset="100%" stop-color="#ded4c1"/>
    </linearGradient>
    <linearGradient id="glass4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef1ec"/>
      <stop offset="100%" stop-color="#d7d8cf"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" fill="url(#sky4)"/>
  <!-- standing mirror -->
  <g transform="translate(150 42)">
    <rect x="-6" y="-6" width="132" height="212" rx="62" fill="#cbb99a" stroke="#1c1a17" stroke-width="2.4"/>
    <rect x="6" y="6" width="108" height="188" rx="52" fill="url(#glass4)" stroke="#1c1a17" stroke-width="1.4"/>
    <!-- stand -->
    <path d="M22 206 l14 42 M98 206 l-14 42 M30 248 h60" fill="none" stroke="#1c1a17" stroke-width="2" stroke-linecap="round"/>
    <!-- reflection that does not quite match -->
    <g opacity="0.55">
      <circle cx="60" cy="80" r="28" fill="#7a7366" opacity="0.4"/>
      <path d="M60 108 v44 M38 128 q22 15 44 0" fill="none" stroke="#1c1a17" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    </g>
    <!-- glass highlight -->
    <path d="M30 28 C24 68 24 120 34 166" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  </g>
  <!-- polkadot dress on a hanger -->
  <g transform="translate(320 74)">
    <circle cx="40" cy="6" r="5" fill="none" stroke="#1c1a17" stroke-width="2"/>
    <path d="M40 11 v9 M8 46 L40 20 L72 46" fill="none" stroke="#1c1a17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 42 L40 26 L62 42 L58 62 L74 152 C56 166 24 166 6 152 L22 62 Z" fill="#c97878" stroke="#1c1a17" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#f8f3e8">
      <circle cx="30" cy="72" r="4"/><circle cx="52" cy="68" r="4"/>
      <circle cx="40" cy="94" r="4"/><circle cx="22" cy="106" r="4"/>
      <circle cx="58" cy="106" r="4"/><circle cx="40" cy="126" r="4"/>
      <circle cx="26" cy="142" r="4"/><circle cx="56" cy="142" r="4"/>
    </g>
  </g>
</svg>
